<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs"
>
  <div
    class="bg-white rounded-2xl border border-slate-200 shadow-xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-150"
  >
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <div>
        <h3 class="text-lg font-black text-[#0F172A]">Add New Destination</h3>
        <p class="text-xs text-slate-500">Create a location entry for packaging travel tours.</p>
      </div>
      <button
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100"
      >
        <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
      </button>
    </div>

    <!-- Error Banner -->
    @if (errorMessage()) {
      <div
        class="px-6 py-3 bg-rose-50 border-b border-rose-100 text-rose-700 text-xs flex items-center justify-between"
      >
        <span>{{ errorMessage() }}</span>
        <button (click)="errorMessage.set(null)" class="font-bold underline cursor-pointer">
          Dismiss
        </button>
      </div>
    }

    <!-- Form Content -->
    <form [formGroup]="destinationForm" (ngSubmit)="submitForm()" class="p-6 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-input
          label="City / Location Name"
          placeholder="e.g. Santorini"
          formControlName="city"
          [required]="true"
        ></app-input>

        <app-input
          label="Country"
          placeholder="e.g. Greece"
          formControlName="country"
          [required]="true"
        ></app-input>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-semibold uppercase text-slate-600"
          >Region Tag <span class="text-rose-500">*</span></label
        >
        <select
          formControlName="regionTag"
          class="w-full px-3.5 py-2 text-xs bg-white border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#0EA5E9]"
        >
          @for (reg of regionOptions; track reg) {
            <option [value]="reg">{{ reg }}</option>
          }
        </select>
      </div>

      <app-input
        label="Cover Image URL"
        placeholder="https://images.unsplash.com/photo-..."
        formControlName="image_url"
        [required]="true"
      ></app-input>

      <!-- Live Image Preview -->
      @if (destinationForm.get('image_url')?.value) {
        <div class="rounded-xl overflow-hidden border border-slate-200 h-28 bg-slate-50">
          <img
            [src]="destinationForm.get('image_url')?.value"
            alt="Preview"
            class="w-full h-full object-cover"
          />
        </div>
      }

      <div class="space-y-1.5">
        <label class="block text-xs font-semibold uppercase text-slate-600"
          >Description <span class="text-rose-500">*</span></label
        >
        <textarea
          rows="3"
          formControlName="description"
          placeholder="Briefly describe this destination..."
          class="w-full px-3.5 py-2 text-xs bg-white border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0EA5E9]"
        ></textarea>
      </div>

      <!-- Footer Buttons -->
      <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
        <app-button variant="outline" size="md" (clicked)="onClose()" type="button">
          Cancel
        </app-button>
        <app-button variant="primary" size="md" type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Saving...' : 'Save Destination' }}
        </app-button>
      </div>
    </form>
  </div>
</div>

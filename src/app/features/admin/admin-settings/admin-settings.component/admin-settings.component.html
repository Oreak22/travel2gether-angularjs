<div class="max-w-4xl space-y-6">
  <div>
    <h1 class="text-2xl font-black text-[#0F172A]">System Settings</h1>
    <p class="text-xs text-slate-500">
      Configure portal preferences, currency, and Paystack API keys
    </p>
  </div>

  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-6">
    <form [formGroup]="settingsForm" class="space-y-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">
        Paystack Integration Settings
      </h2>
      <app-input label="Paystack Public Key" formControlName="paystackPublicKey"></app-input>
      <app-input
        label="Paystack Secret Key"
        type="password"
        formControlName="paystackSecretKey"
      ></app-input>

      <h2
        class="text-xs font-bold uppercase tracking-wider text-slate-400 pt-4 border-t border-slate-100"
      >
        Application Configuration
      </h2>
      <app-input label="Site Currency Code" formControlName="currency"></app-input>
      <app-input label="Support Email Address" formControlName="supportEmail"></app-input>

      <div class="pt-4 border-t border-slate-100">
        <app-button variant="primary" size="md">Save Settings</app-button>
      </div>
    </form>
  </div>
</div>

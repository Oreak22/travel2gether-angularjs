<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
  <div class="border-b border-slate-200 pb-4">
    <h1 class="text-2xl font-black text-[#0F172A]">Account & Security Settings</h1>
    <p class="text-xs text-slate-500">
      Manage your profile details and account security preferences
    </p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-6">
    <!-- Avatar Section -->
    <div class="flex items-center space-x-4 border-b border-slate-100 pb-6">
      <div class="relative">
        <img
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200"
          alt="Profile"
          class="w-20 h-20 rounded-full object-cover border-2 border-slate-200"
        />
        <button
          class="absolute bottom-0 right-0 bg-[#0EA5E9] text-white p-1.5 rounded-full shadow-xs hover:bg-sky-600"
        >
          <lucide-icon name="camera" class="w-3.5 h-3.5"></lucide-icon>
        </button>
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-900">Jane Doe</h3>
        <p class="text-xs text-slate-500">jane.doe&#64;example.com</p>
      </div>
    </div>

    <!-- Personal Info Form -->
    <form [formGroup]="profileForm" class="space-y-4">
      <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Personal Details</h4>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-input label="First Name" formControlName="firstName"></app-input>
        <app-input label="Last Name" formControlName="lastName"></app-input>
        <app-input label="Email Address" type="email" formControlName="email"></app-input>
        <app-input label="Phone Number" formControlName="phone"></app-input>
      </div>

      <div class="pt-4 border-t border-slate-100">
        <app-button variant="primary" size="md">Save Profile Changes</app-button>
      </div>
    </form>
  </div>
</div>
